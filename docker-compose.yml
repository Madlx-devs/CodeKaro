services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-dsa}
      POSTGRES_USER: ${DB_USER:-dsa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dsa} -d ${DB_NAME:-dsa}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-dsa}
      DB_USER: ${DB_USER:-dsa}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JAVA_RUNNER_IMAGE: ${JAVA_RUNNER_IMAGE:-eclipse-temurin:17-jdk}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DSA_WORK_DIR: /opt/dsa-work
      DSA_WORK_VOLUME: dsa-work
    volumes:
      # The code runner spawns sibling sandbox containers via the host's Docker daemon.
      # Required in production. The app container runs untrusted code ONLY inside those
      # locked-down child containers, never in the app container itself.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared NAMED volume for the code runner (see DockerJavaRunner): the app writes
      # per-run sources here, and the host Docker daemon mounts the same volume BY NAME
      # into sandbox containers. A named volume is resolved by the daemon itself, unlike
      # a bind mount of a container-local path, which the host cannot see (classic
      # Docker-out-of-Docker gotcha).
      - dsa-work:/opt/dsa-work

volumes:
  pgdata:
  dsa-work:
    name: dsa-work
